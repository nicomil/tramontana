name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore (locked mode)
        run: dotnet restore Tramontana.slnx -p:Platform=x64 --locked-mode
      - name: Build
        run: dotnet build Tramontana.slnx -c Release -p:Platform=x64 --no-restore
      - name: Test
        # Built by project: the solution build puts the outputs in bin\Release, dotnet test with Platform=x64 looks in bin\x64\Release.
        run: dotnet test tests/Tramontana.Tests -c Release -p:Platform=x64 --no-restore
