name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore (locked mode)
        run: dotnet restore WinCleaner.slnx -p:Platform=x64 --locked-mode
      - name: Build
        run: dotnet build WinCleaner.slnx -c Release -p:Platform=x64 --no-restore
      - name: Test
        run: dotnet test tests/WinCleaner.Tests -c Release -p:Platform=x64 --no-build
